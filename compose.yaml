services:
  litellm-go:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_GO_MANAGEMENT_API: ${LITELLM_GO_MANAGEMENT_API:-true}
      LITELLM_GO_PROVIDER_APIS: ${LITELLM_GO_PROVIDER_APIS:-true}
      LITELLM_GO_ROUTE_PUBLICATION_TOKEN: ${LITELLM_GO_ROUTE_PUBLICATION_TOKEN:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
    restart: unless-stopped
